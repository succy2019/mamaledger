<div class="absolute -bottom-10 -left-10 w-48 h-48 bg-primary-fixed opacity-20 rounded-full blur-3xl"></div>
</div>
<!-- Content Section -->
<div class="text-center space-y-stack-sm w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">
                Welcome to MamaLedger
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                Record your sales just by talking!
            </p>
</div>
<!-- Action Section -->
<div class="mt-stack-lg w-full flex flex-col items-center space-y-stack-md">
<!-- Large CTA Button -->
<button class="w-full h-touch-target-min bg-primary text-on-primary font-headline-md text-headline-md rounded-xl shadow-lg active:scale-95 transition-transform duration-150 flex items-center justify-center gap-base">
                Start
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary Path / Language Info -->
<div class="flex items-center gap-base text-on-surface-variant">
<span class="material-symbols-outlined text-secondary" data-icon="record_voice_over" style="font-variation-settings: 'FILL' 1;">record_voice_over</span>
<span class="font-label-lg text-label-lg">Support Pidgin &amp; English</span>
</div>
